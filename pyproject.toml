[project]
name = "webtoon-ocr"
version = "0.1.0"
description = "Tradutor de webtoon coreano por visao computacional, com overlay global no Windows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paddleocr>=3.0",
    # Build CUDA. Testada nesta maquina numa RTX 5060 Ti (Blackwell, sm_120):
    # funciona, e deixa o OCR ~100x mais rapido que a build de CPU. O mesmo
    # pacote roda em CPU quando se passa device="cpu", entao serve de fallback.
    # Fixada: a 3.4.0 no indice do Paddle so tem wheel de Linux.
    "paddlepaddle-gpu==3.3.1",
    # Runtime CUDA. Precisa vir declarado: o paddlepaddle-gpu nao arrasta essas
    # wheels sozinho, e sem cudnn64_9.dll a GPU falha na primeira inferencia.
    "nvidia-cudnn-cu12==9.9.0.52",
    "nvidia-cublas-cu12==12.9.0.13",
    "nvidia-cuda-runtime-cu12==12.9.37",
    "nvidia-cufft-cu12==11.4.0.6",
    "nvidia-curand-cu12==10.3.10.19",
    "nvidia-cusolver-cu12==11.7.4.40",
    "nvidia-cusparse-cu12==12.5.9.5",
    "nvidia-nvjitlink-cu12==12.9.86",
    "pyside6>=6.7",
    "mss>=9.0",
    "pynput>=1.7",
    "pillow>=10.0",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.scripts]
wt = "webtoon_ocr.cli:main"
wt-app = "webtoon_ocr.app:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.uv.sources]
# O indice do Paddle e o que tem as builds win_amd64 destes pacotes CUDA.
paddlepaddle-gpu = { index = "paddle-cu129" }
nvidia-cudnn-cu12 = { index = "paddle-cu129" }
nvidia-cublas-cu12 = { index = "paddle-cu129" }
nvidia-cuda-runtime-cu12 = { index = "paddle-cu129" }
nvidia-cufft-cu12 = { index = "paddle-cu129" }
nvidia-curand-cu12 = { index = "paddle-cu129" }
nvidia-cusolver-cu12 = { index = "paddle-cu129" }
nvidia-cusparse-cu12 = { index = "paddle-cu129" }
nvidia-nvjitlink-cu12 = { index = "paddle-cu129" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webtoon_ocr"]
